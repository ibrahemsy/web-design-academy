<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="الأكاديمية البرمجية i.z - منصة عربية لتعلم البرمجة وتصميم وتطوير مواقع الويب.">
  <meta name="theme-color" content="#101B32">
  <title>الأكاديمية البرمجية i.z</title>
</head>
<body>
  <script>
    (() => {
      const normalizeLocale = (value) =>
        String(value || 'en').split('@')[0].split('.')[0].replace(/_/g, '-');
      try {
        const language = navigator.language;
        const normalizedLanguage = normalizeLocale(language);
        if (normalizedLanguage !== language) {
          Object.defineProperty(navigator, 'language', {
            configurable: true,
            get: () => normalizedLanguage,
          });
        }
        const languages = Array.from(navigator.languages || []);
        const normalizedLanguages = languages.map(normalizeLocale).filter(Boolean);
        if (normalizedLanguages.length &&
            normalizedLanguages.some((value, index) => value !== languages[index])) {
          Object.defineProperty(navigator, 'languages', {
            configurable: true,
            get: () => normalizedLanguages,
          });
        }
      } catch (_) {
        // Keep the browser defaults if the environment prevents locale normalization.
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
