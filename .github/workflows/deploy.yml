name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify repository release invariants
        run: python3 scripts/verify_repository.py
      - name: Run automated unit tests
        run: flutter test
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Build web
        run: flutter build web --release --base-href /web-design-academy/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed website assets
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/smoke_test_deployment.py
      - name: Set up Node.js for browser smoke test
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test deployed website in Chromium
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/smoke_test_browser.mjs
